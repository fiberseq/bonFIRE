# Multiple reference assembly mode, building the graph only (no consensus peak calling). The input file only
# needs one line per assembly, and path_to_fire_output_folder can be NA. The graph is written to
# [output_dir]/[prefix]/graph/[prefix].full_all_chrs.gbz; give that path as graph: in later runs.
output_dir: /path/to/output_dir
prefix: my_graph
input_file: /path/to/bonFIRE/config/sample_configs/input_multiref_graph_only.txt
make_graph_only: True
main_reference_fasta: /path/to/references/CHM13.fa
main_reference_name: CHM13
# optional; remove both lines to leave the secondary reference out of the graph
secondary_reference_fasta: /path/to/references/GRCh38.fa
secondary_reference_name: GRCh38
split_graph: False
graph_mem: 300000
graph_runtime: 1440
